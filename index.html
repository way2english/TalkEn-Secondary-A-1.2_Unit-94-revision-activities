{id:'gr',name:'📅 Present Continuous',intro:'<p><b>am / is / are + дієслово з -ing</b> — для домовленого майбутнього: є час, день, квиток чи домовленість з кимось. <i>I am seeing my doctor tomorrow at 4 p.m.</i></p><p>🧠 Лайфхак: дія записана в щоденнику чи з кимось домовлена? Вживай Present Continuous — так само, як для дії прямо зараз!</p><p><b>Правопис -ing:</b> звичайні дієслова + -ing (go → going, see → seeing). Німе <b>-e</b> зникає (make → making, drive → driving). Короткі слова «приголосна-голосна-приголосна» подвоюють останню букву (run → running, get → getting).</p><p><b>Слова часу:</b> tonight, this evening, tomorrow, next week, on Friday, after school.</p>',ex:['g3','g4','g5']},
{id:'vocab',name:'🧩 Vocabulary',intro:'<p>to have friends over — приймати гостей · to shoot a video — знімати відео · to see someone — зустрітись із кимось · to go to the mall — піти в ТРЦ · to go out — йти гуляти · to stay in — залишатися вдома · to go to a camp — поїхати в табір · to have a class / practice — мати урок / тренування · to sleep over at — ночувати в когось · to go to a birthday party — іти на день народження · to go on a field trip — поїхати на екскурсію · to take part in an academic competition — брати участь в олімпіаді · tonight — сьогодні ввечері · to hang out — гуляти з друзями · to show someone around — показувати місто · a schedule — розклад</p>',ex:['v1']},
{id:'phr',name:'💬 Phrases',intro:'<p>🟢 <b>Спитати, чи вільний:</b> Are you busy tonight? · Are you free tonight? · What are you doing this evening?</p><p>🔵 <b>Запросити:</b> Would you like to go to the mall? · How about going out? · Why don\'t we shoot a video?</p><p>🟢 <b>Прийняти:</b> Sounds great! · It\'s a wonderful idea. · I\'d love to! · Nice idea.</p><p>🔴 <b>Відмовити:</b> Sorry, I can\'t. I have plans. · Sorry, I\'m staying in tonight. · I\'d love to, but I\'m busy.</p>',ex:['f2']},
{id:'speak',name:'🎤 Speaking',intro:'<p>Працюй у парі. Усі завдання подано українською, а розмовляти треба англійською. Виконали завдання разом — познач галочку й отримай бали. Макро-сценарії й дискусії в кінці — без балів, для практики.</p>',ex:[]}
];
const EX={

const SP=[
{id:'s0',t:'📞 Картка 1: Вільний вікенд',a:'<b>Ситуація:</b> учень A телефонує учню B, щоб дізнатись про плани на вікенд.<br><b>Учень A:</b> спитай, чи вільний B сьогодні ввечері або в суботу. Запропонуй погуляти в ТРЦ.',b:'<b>Учень B:</b> скажи, що в суботу зайнятий(-а), бо в тебе гості, але ввечері вільний(-а).<br><i>Готово, коли: обидва поставили й відповіли щонайменше на два запитання.</i>',ph:'«зайнятий сьогодні ввечері» · «погуляти» · «піти в ТРЦ» · «приймати друзів вдома»'},
{id:'s1',t:'🌙 Картка 2: Ночівля',a:'<b>Ситуація:</b> учні обговорюють плани на вечір п’ятниці.<br><b>Учень A:</b> запроси B переночувати в тебе й подивитись фільми.',b:'<b>Учень B:</b> із радістю погодься й спитай, о котрій приходити.<br><i>Готово, коли: A запросив(-ла), B погодився(-лась) і назвали точний час.</i>',ph:'«ночувати в когось» · «залишатися вдома» · «сьогодні ввечері» · «чудово!»'},
{id:'s2',t:'🎬 Картка 3: Відео для проєкту',a:'<b>Ситуація:</b> учні мають разом зробити шкільний проєкт.<br><b>Учень A:</b> запропонуй завтра вдень зняти відео для проєкту з науки.',b:'<b>Учень B:</b> відмов, бо в тебе тренування з плавання, але запропонуй зустрітись після 18:00.<br><i>Готово, коли: A запропонував(-ла) час, а B домовився(-лась) про інший.</i>',ph:'«зняти відео» · «шкільний проєкт» · «мати тренування» · «вибач, я не можу»'},
{id:'s3',t:'🍕 Картка 4: Двоюрідний брат у місті',a:'<b>Ситуація:</b> до учня B приїхав у гості двоюрідний брат із іншого міста.<br><b>Учень A:</b> запроси B піти сьогодні ввечері на піцу.',b:'<b>Учень B:</b> поясни, що показуєш кузену місто, але запроси A приєднатись.<br><i>Готово, коли: B пояснив(-ла) свій план і запросив(-ла) A.</i>',ph:'«піти гуляти» · «показувати місто» · «сьогодні ввечері» · «чи не хотів(-ла) б ти…»'},
{id:'s4',t:'🎒 Картка 5: Екскурсія',a:'<b>Ситуація:</b> учні говорять про завтрашню шкільну екскурсію.<br><b>Учень A:</b> спитай B, що він(вона) бере із собою на екскурсію до наукового музею.',b:'<b>Учень B:</b> скажи, о котрій відходить автобус і що ти береш.<br><i>Готово, коли: обидва назвали щонайменше дві деталі про поїздку.</i>',ph:'«їхати на екскурсію» · «розклад» · «пакувати одяг» · «що ти робиш?»'},
{id:'s5',t:'🏆 Картка 6: Олімпіада',a:'<b>Ситуація:</b> учень A готується до олімпіади з математики.<br><b>Учень B:</b> спитай A, чи хоче він(вона) піти сьогодні в кіно.',b:'<b>Учень A:</b> поясни, що завтра береш участь в олімпіаді й маєш вчитись.<br><i>Готово, коли: A ввічливо відмовив(-ла) й розповів(-ла) про підготовку.</i>',ph:'«брати участь» · «олімпіада» · «залишатись вдома» · «в мене плани»'},
{id:'s6',t:'🎂 Картка 7: Запрошення на день народження',a:'<b>Ситуація:</b> учень A влаштовує вечірку на цю суботу.<br><b>Учень A:</b> запроси B на день народження о 17:00.',b:'<b>Учень B:</b> зрадій, прийми запрошення й спитай, чи можна принести закуски.<br><i>Готово, коли: A назвав(-ла) деталі, а B підтвердив(-ла).</i>',ph:'«іти на день народження» · «чудово!» · «що ти робиш?» · «закуски»'},
{id:'s7',t:'🌲 Картка 8: Літній табір',a:'<b>Ситуація:</b> учні говорять про плани на літо.<br><b>Учень A:</b> спитай B, чи їде він(вона) цього року в літній табір.',b:'<b>Учень B:</b> скажи, що їдеш в англійський табір у липні й спатимеш у наметах.<br><i>Готово, коли: обидва розповіли по одній деталі про табір.</i>',ph:'«їхати в табір» · «вижити в лісі» · «наступного місяця» · «а як щодо…»'},
{id:'s8',t:'📅 Картка 9: Зайнятий розклад',a:'<b>Ситуація:</b> учні порівнюють тижневі розклади.<br><b>Учень A:</b> спитай B, чому його(її) розклад цього тижня такий насичений.',b:'<b>Учень B:</b> назви три справи цього тижня (лікар, тренування, зустріч із друзями).<br><i>Готово, коли: B назвав(-ла) щонайменше три домовлені події.</i>',ph:'«розклад» · «зустрітись із кимось» · «мати урок» · «візит до лікаря»'},
{id:'s9',t:'🌳 Картка 10: Несподіване запрошення',a:'<b>Ситуація:</b> учень A хоче погуляти після школи.<br><b>Учень A:</b> запропонуй піти після школи в новий парк.',b:'<b>Учень B:</b> відмов, бо залишаєшся вдома й дивишся за молодшим братом.<br><i>Готово, коли: A запропонував(-ла) заняття, а B ввічливо відмовив(-ла) з чіткою причиною.</i>',ph:'«погуляти» · «залишатись вдома» · «чому б нам не…» · «вибач, я не можу»'},
{id:'m0',np:1,t:'🎈 Макро-сценарій 1: Сюрприз-вечірка',a:'<b>Контекст:</b> ви готуєте сюрприз-вечірку для однокласника Сема.<br><b>Учень A:</b> хочеш влаштувати її вдома в п’ятницю ввечері. Запропонуй купити прикраси й попкорн.',b:'<b>Учень B:</b> погоджуєшся, але пропонуєш спочатку зняти відео-монтаж і щоб усі залишились ночувати.<br><i>План розмови: привітання й мета → дата, час і місце (Present Continuous) → їжа, прикраси, розваги → остаточні домовленості й розподіл завдань.</i>',ph:'«ми влаштовуємо вечірку в п’ятницю» · «ми купуємо прикраси» · «усі ночують у мене»'},
{id:'m1',np:1,t:'🧭 Макро-сценарій 2: Друг-екскурсовод',a:'<b>Контекст:</b> учень B вперше приїхав у місто учня A.<br><b>Учень A:</b> господар. Запропонуй завтра показати B торговий центр та історичні місця.',b:'<b>Учень B:</b> гість. Став запитання про розклад і запропонуй, що хочеш побачити.<br><i>План розмови: привітайте друга й спитайте про дорогу → розклад на завтра (Present Continuous) → обід чи покупки в ТРЦ → час зустрічі.</i>',ph:'«ми відвідуємо…» · «я показую тобі місто» · «о котрій ми зустрічаємось?»'},
{id:'m2',np:1,t:'🎸 Макро-сценарій 3: Перенесення репетиції',a:'<b>Контекст:</b> у вас сьогодні вечірня репетиція, але в A зірвались плани.<br><b>Учень A:</b> зателефонуй B і поясни, що йдеш сьогодні до стоматолога й не можеш прийти.',b:'<b>Учень B:</b> прояви розуміння й запропонуй перенести репетицію на четвер після обіду.<br><i>План розмови: дзвінок і зміна планів → ввічлива відмова → новий день і час → підтвердження.</i>',ph:'«вибач, я не можу» · «я йду до стоматолога» · «а як щодо четверга?»'},
{id:'d0',np:1,t:'🏠 Дискусія 1: Вдома чи гуляти',a:'<b>Питання:</b> що краще на вихідних: залишатись вдома чи гуляти з друзями?<br><b>Команда «Вдома»:</b> відпочинок, заощадження, хобі; не залежиш від погоди й розкладу.<br><b>Команда «Гуляти»:</b> нові місця, спогади, соціальні навички й настрій.<br>Як ти вирішуєш, що робити в п’ятницю ввечері? Яким був би твій ідеальний вікенд з друзями?',b:'',ph:'«проводити час удома» · «гуляти з друзями» · «якісний час разом» · «насичений розклад»'},
{id:'d1',np:1,t:'📚 Дискусія 2: Олімпіади і стрес',a:'<b>Питання:</b> чи мають усі школярі брати участь в олімпіадах?<br><b>За:</b> мотивація, перевірка знань, впевненість і користь для вступу.<br><b>Проти (обов’язкові):</b> стрес і тривога; краще займатись тим, що цікаво, без тиску.<br>Чи брав(-ла) ти участь в олімпіаді? Що відчував(-ла)? Як підготуватись без стресу?',b:'',ph:'«брати участь у змаганнях» · «відчувати стрес» · «отримати цінний досвід»'},
{id:'d2',np:1,t:'🌲 Дискусія 3: Табір чи сімейна подорож',a:'<b>Питання:</b> чи кращий літній табір за сімейну подорож для підлітка?<br><b>Табір:</b> самостійність, нові друзі, командна робота й лідерство.<br><b>Сімейна подорож:</b> міцніші родинні зв’язки, комфортний розклад, безпека.<br>Що б ти обрав(-ла): спати в наметі в таборі чи жити в готелі з родиною? Чого можна навчитись, прожив(ши) тиждень без дому?',b:'',ph:'«їхати в літній табір» · «розвивати самостійність» · «проводити час із родиною»'}
];
const SPPTS=10,$=(s,e=document)=>e.querySelector(s);
let S={};try{S=JSON.parse(localStorage.getItem('u94')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('u94',JSON.stringify(S))}catch(e){}};
const norm=s=>s.toLowerCase().replace(/[’‘`]/g,"'").replace(/[?.!]/g,'').replace(/\s+/g,' ').trim();
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function mkItem(id,i){
 const [q,a,o,w]=EX[id].items[i],key=id+i,el=document.createElement('div');let tries=0;
 el.className='item';
 el.innerHTML=`<div class="n">${i+1}</div><div class="b"><p class="q">${q.replace('___','<span class="blank"></span>')}</p><div class="ctl"></div><p class="fb"></p></div>`;
 const ctl=$('.ctl',el),fb=$('.fb',el);
 const show=(p,ok)=>{el.classList.add(ok?'ok':'bad');ctl.innerHTML='';fb.innerHTML=(ok?`✅ +${p} б. `:`❌ Правильна відповідь: <b>${a[0]}</b>. `)+(w||'')};
 if(S[key]!=null){show(S[key],S[key]>0);return el}
 const check=v=>{
  if(a.map(norm).includes(norm(v))){S[key]=tries?5:10;save();show(S[key],1);upd()}
  else if(tries++){S[key]=0;save();show(0,0);upd()}
  else fb.textContent='🤔 Не зовсім. Спробуй ще раз — за другу спробу 5 балів.';
 };
 if(o){shuf(o).forEach(t=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{b.disabled=true;check(t)};ctl.append(b)})}
 else{const inp=document.createElement('input'),b=document.createElement('button');inp.placeholder='Твоя відповідь';inp.autocomplete='off';inp.setAttribute('aria-label','Відповідь');b.textContent='Перевірити';b.className='go';
  const go=()=>{if(inp.value.trim())check(inp.value)};b.onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go()};ctl.append(inp,b)}
 return el;
}
function build(){
 const nav=$('#nav'),main=$('#main');nav.innerHTML='';main.innerHTML='';
 TABS.forEach((t,k)=>{
  const b=document.createElement('button');b.textContent=t.name;b.dataset.t=t.id;b.onclick=()=>open(t.id);nav.append(b);
  const p=document.createElement('section');p.className='panel';p.id='p-'+t.id;p.innerHTML=`<div class="intro">${t.intro}</div>`;
  t.ex.forEach(id=>{const e=EX[id],d=document.createElement('div');d.className='ex';d.id='ex-'+id;
   d.innerHTML=`<span class="sc"></span><h2>${e.t}</h2><p class="ins">${e.i}</p>`;
   e.items.forEach((_,i)=>d.append(mkItem(id,i)));p.append(d)});
  if(t.id==='speak')SP.forEach(s=>{const c=document.createElement('div');c.className='card';
   c.innerHTML=`<h3>${s.t}</h3><div class="who">${s.a}</div>${s.b?`<div class="who">${s.b}</div>`:''}<p class="ph">💬 Скажи англійською: ${s.ph}</p>${s.np?'<p class="np">Без балів, для практики</p>':`<label class="chk"><input type="checkbox" ${S[s.id]?'checked':''}> Ми це зробили (+${SPPTS} б.)</label>`}`;
   const ck=$('input',c);if(ck)ck.onchange=e=>{if(e.target.checked)S[s.id]=SPPTS;else delete S[s.id];save();upd()};p.append(c)});
  const nx=document.createElement('div');nx.className='next';
  if(TABS[k+1]){const nb=document.createElement('button');nb.textContent='Далі: '+TABS[k+1].name+' →';nb.onclick=()=>open(TABS[k+1].id);nx.append(nb)}else nx.textContent='🎉 Це був останній розділ. Молодець!';
  p.append(nx);main.append(p)});
 open(TABS[0].id);upd();
}
function open(id){document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id==='p-'+id));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===id));scrollTo(0,0)}
function upd(){
 let tot=0,max=0;
 TABS.forEach(t=>{let done=true;
  t.ex.forEach(id=>{const n=EX[id].items.length;let s=0,c=0;for(let i=0;i<n;i++){if(S[id+i]!=null){s+=S[id+i];c++}}
   tot+=s;max+=n*10;if(c<n)done=false;$('#ex-'+id+' .sc').textContent=`${s} / ${n*10}`});
  if(t.id==='speak'){SP.filter(s=>!s.np).forEach(s=>{max+=SPPTS;if(S[s.id])tot+=SPPTS;else done=false})}
  $(`nav button[data-t="${t.id}"]`).classList.toggle('full',done)});
 $('#pts').textContent=tot;$('#max').textContent=max;$('#fill').style.width=(max?tot/max*100:0)+'%';
 const r=max?tot/max:0;$('#rank').textContent=r>=.9?'🏆 Майстер шопінгу':r>=.7?'🥇 Чудово!':r>=.4?'🥈 Гарний прогрес':r>0?'🌱 Початок є':'';
}
$('#reset').onclick=()=>{if(confirm('Скинути всі бали й відповіді?')){S={};save();build()}};
build();
</script>
</body>
</html>
